<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOM Segmenter">
<title>SegmentRouter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="banner"></div>
<main>
  <section id="tab-login" class="tab" hidden></section>
  <section id="tab-map" class="tab" hidden>
    <div id="map-top"></div>
    <div id="map-main"></div>
    <div id="map-panel"></div>
  </section>
  <section id="tab-segments" class="tab" hidden></section>
  <section id="tab-route" class="tab" hidden>
    <div id="map-route"></div>
    <div id="route-body"></div>
  </section>
  <section id="tab-profile" class="tab" hidden></section>
</main>
<nav>
  <button data-tab="map"><span>🌍</span>Touren</button>
  <button data-tab="segments"><span>⛰</span>Segmente</button>
  <button data-tab="route"><span>↗</span>Route</button>
  <button data-tab="profile"><span>◉</span>Profil</button>
</nav>
<div id="sheet" hidden></div>
<div id="overlay" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
